# Configuration for Hiver Support Agent

project:
  name: hiver-support-agent
  version: 0.1.0
  target_brand: AmazonHelp

datasets:
  twitter:
    raw_path: data/raw/customer_support_on_twitter.csv
    chunk_size: 250000
    date_format: "%a %b %d %H:%M:%S %z %Y"
  banking77:
    train_path: data/external/banking77/banking77_train.csv
    test_path: data/external/banking77/banking77_test.csv

preprocessing:
  sample_size: 10000
  min_thread_depth: 2
  max_thread_depth: 10

generation:
  top_k_evidence: 3
  confidence_threshold: 0.60
  llm_provider: gemini
  model_name: gemini-1.5-flash
  max_response_length: 500
  temperature: 0.2

decision:
  risk_threshold: 0.35
  confidence_threshold: 0.60
  min_retrieval_score: 0.70
  high_risk_intents:
    - payment_billing_issue
    - account_access_login
    - third_party_seller_issue
    - refund_status_request
    - damaged_defective_item
  weights:
    intent_uncertainty: 0.40
    retrieval_quality: 0.30
    category_risk: 0.30

retrieval:
  mode: hybrid
  dense_top_k: 50
  bm25_top_k: 50
  rrf_k: 60
  intent_boost_factor: 0.15

reranking:
  enabled: false
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidate_k: 30
  final_top_k: 3




