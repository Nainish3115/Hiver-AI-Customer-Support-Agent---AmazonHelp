[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "Customer Support Automation Agent with RAG, Intent Classification, and Human Escalation Decision System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SDE/AI Engineering Candidate"}
]

dependencies = [
    "pandas>=2.0.0",
    "numpy==1.16.3",
    "scikit-learn>=1.2.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "pyyaml==5.1",
    "google-genai>=0.1.0",
    "google-generativeai>=0.3.0",
    "sentence-transformers==5.6.0",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "fastapi==0.65.2",
    "uvicorn==0.11.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx==0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]
[tool.vercel]
entrypoint = "src.hiver_agent.api.app:app"
